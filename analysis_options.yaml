include: package:very_good_analysis/analysis_options.yaml

analyzer:
  plugins:
    - custom_lint
  errors:
    analysis_options_deprecated_plugins: ignore
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    # Auto-appended by `flutter analyze`'s own one-time migration; harmless
    # (no .dart files live under these dirs), kept for clarity.
    - build/**
    - android/**
    - ios/**
    - web/**
