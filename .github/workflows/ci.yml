name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: make setup
      - name: Format check
        run: make format-check
      - name: Analyze
        run: make analyze
      - name: Unit tests
        run: make test
      - name: E2E tests
        run: make e2e
      - name: Build web
        run: make build-web
